<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR Booking Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/base.css?v=scrollbar-20260909">
    <link rel="stylesheet" href="assets/css/glass-theme.css">
    <script src="firebase-config.js?v=production-web-20260909"></script>
</head>
<body>
<main class="auth-screen">
  <div class="wrap">
    <div class="auth-layout">
      <section class="auth-copy">
        <span class="eyebrow" data-ui="eyebrow"></span>
        <h1 id="register-title" data-ui="title"></h1>
        <p data-ui="intro"></p>
      </section>

      <section class="glass auth-panel" aria-labelledby="register-title">
        <div class="auth-brand">
          <div class="auth-brand-mark" aria-hidden="true">JR</div>
          <span data-ui="brand-small"></span>
        </div>

        <form class="auth-form" id="register-form">
          <div class="auth-field">
            <label for="display-name" data-ui="full-name-label"></label>
            <input id="display-name" name="displayName" type="text" autocomplete="name" required>
          </div>

          <div class="auth-field">
            <label for="email" data-ui="email-label"></label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="auth-field">
            <label for="password" data-ui="password-label"></label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
            <span class="auth-help" data-ui="password-help"></span>
          </div>

          <div class="auth-field">
            <label for="confirm-password" data-ui="confirm-password-label"></label>
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
          </div>

          <div class="auth-actions">
            <button class="btn btn-solid" type="submit" data-ui="submit"></button>
          </div>

          <p class="auth-status" id="auth-status" role="status" aria-live="polite"></p>
          <a class="auth-link" href="login.html" data-ui="login-link"></a>
          <a class="auth-link" href="index.html" data-ui="back-home"></a>
        </form>
      </section>
    </div>
  </div>
</main>

<script type="module">
  import { UI_STRINGS } from './js/core/strings-fr.js';
  import { getAuthErrorMessage, isAuthConfigured, registerClientAccount } from './js/core/auth-guard.js';
  import { showNotification } from './js/shared/notifications.js';

  const strings = UI_STRINGS.auth;
  const form = document.querySelector('#register-form');
  const status = document.querySelector('#auth-status');
  const submitButton = form.querySelector('button[type="submit"]');

  document.title = strings.register.pageTitle;
  document.querySelector('[data-ui="eyebrow"]').textContent = strings.register.eyebrow;
  document.querySelector('[data-ui="title"]').textContent = strings.register.title;
  document.querySelector('[data-ui="intro"]').textContent = strings.register.intro;
  document.querySelector('[data-ui="brand-small"]').textContent = strings.shared.brandSmall;
  document.querySelector('[data-ui="full-name-label"]').textContent = strings.shared.fullNameLabel;
  document.querySelector('[data-ui="email-label"]').textContent = strings.shared.emailLabel;
  document.querySelector('[data-ui="password-label"]').textContent = strings.shared.passwordLabel;
  document.querySelector('[data-ui="password-help"]').textContent = strings.register.passwordHelp;
  document.querySelector('[data-ui="confirm-password-label"]').textContent = strings.shared.confirmPasswordLabel;
  document.querySelector('[data-ui="submit"]').textContent = strings.register.submit;
  document.querySelector('[data-ui="login-link"]').textContent = strings.register.loginLink;
  document.querySelector('[data-ui="back-home"]').textContent = strings.shared.backHome;

  if (!isAuthConfigured()) {
    status.textContent = strings.shared.firebasePending;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const formData = new FormData(form);

    if (formData.get('password') !== formData.get('confirmPassword')) {
      status.textContent = strings.register.passwordMismatch;
      return;
    }

    submitButton.disabled = true;
    status.textContent = strings.shared.submitting;

    try {
      await registerClientAccount({
        displayName: formData.get('displayName'),
        email: formData.get('email'),
        password: formData.get('password')
      });
      status.textContent = strings.register.success;
      showNotification(status.textContent, 'success');
    } catch (error) {
      status.textContent = getAuthErrorMessage(error);
      showNotification(status.textContent, 'error');
    } finally {
      submitButton.disabled = false;
    }
  });
</script>
</body>
</html>
