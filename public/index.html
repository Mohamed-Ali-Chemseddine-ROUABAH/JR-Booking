<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR Booking Premium</title>
    <!-- Bootstrap CSS for grid -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">

    <!-- Application CSS -->
    <link rel="stylesheet" href="assets/css/base.css?v=scrollbar-20260909">
    <link rel="stylesheet" href="assets/css/glass-theme.css">
    <script src="firebase-config.js?v=production-web-20260909"></script>

    <style>
        /* Landing specific styles extracted from mockup */
        .screen { min-height: 100vh; padding: 110px 0 80px; animation: rise .45s ease; }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { .screen { animation: none; } }
        .hero {
            min-height: 78vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            gap: 26px; padding: 0 20px;
        }
        .hero .eyebrow { margin-bottom: -8px; }
        .hero h1 {
            font-family: var(--font-display); font-weight: 600;
            font-size: clamp(1.9rem, 4.2vw, 3.1rem);
            color: var(--ink-100); letter-spacing: -.02em; line-height: 1.15;
            max-width: 16ch; margin: 0;
        }
        .search-pill {
            width: min(560px, 88vw); display: flex; align-items: center; gap: 12px;
            padding: 17px 22px; border-radius: 999px; margin-top: 6px;
        }
        .search-pill svg { width: 17px; opacity: .55; flex-shrink: 0; }
        .search-pill input {
            border: none; background: transparent; outline: none; width: 100%;
            color: var(--ink-100); font-family: var(--font-body); font-size: .95rem;
        }
        .search-pill input::placeholder { color: var(--ink-700); }
        .hero-foot { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--ink-700); margin-top: 2px; }
        .hero-foot a { color: var(--ink-500); border-bottom: 1px dashed var(--ink-700); padding-bottom: 1px; transition: .2s; }
        .hero-foot a:hover { color: var(--ink-100); border-color: var(--ink-100); }
        .round-cta { display: flex; flex-direction: column; align-items: center; gap: 7px; margin-top: 26px; }
        .round-cta button {
          width: 46px; height: 46px; display: grid; place-items: center;
          color: var(--ink-500); background: var(--panel);
          border: 1px solid var(--panel-brd); border-radius: 50%;
        }
          .search-results { width: min(560px, 88vw); display: grid; gap: 8px; margin: 8px auto 0; }
          .search-result { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; color: var(--ink-300); }
          .search-result strong { color: var(--ink-100); }
          .search-result span { color: var(--ink-500); font-size: .78rem; text-align: right; }
          @media (max-width: 430px) { .search-result { display: grid; } .search-result span { text-align: left; } }
        .round-cta button:hover { color: var(--ink-100); border-color: var(--panel-brd-strong); }
        .round-cta svg { width: 17px; }
        .round-cta span { font-family: var(--font-mono); font-size: .62rem; color: var(--ink-700); }
    </style>
</head>
<body>

<section class="screen">
  <div class="wrap">
    <div class="hero">
      <span class="eyebrow" id="ui-eyebrow">JR Booking Premium · version 2</span>
      <h1 id="ui-title">Chaque créneau libre, à portée de clic.</h1>

      <div class="glass search-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" aria-label="Rechercher un professionnel" placeholder="Recherchez un nom ou une spécialité — ex. « Camille R. » ou « Physiothérapie »">
      </div>
      <p class="search-status" id="search-status" role="status" aria-live="polite"></p>
      <div class="search-results" id="search-results" aria-live="polite"></div>

      <div class="hero-foot">
        <span id="ui-looking">Vous cherchez du travail, pas un créneau ?</span>
        <a href="login.html" id="ui-login-link">Je suis un professionnel — me connecter</a>
      </div>

      <div class="round-cta">
        <button type="button" id="professional-request-button" title="Devenir prestataire" aria-label="Devenir prestataire">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <span>DEVENIR PRESTATAIRE</span>
      </div>
      <p class="hero-foot"><a href="privacy-policy.html">Politique de confidentialité</a><span>·</span><a href="terms.html">Conditions d’utilisation</a></p>

    </div>
  </div>
</section>

<!-- Core modules loaded purely client-side as specified -->
<script type="module">
    import { UI_STRINGS } from './js/core/strings-fr.js';
  import { isFirebaseConfigured } from './js/core/firebase-init.js';
  import { debounce } from './js/core/utils.js';
  import { findPublicProfiles } from './js/search/search-professional.js';
  import { showNotification } from './js/shared/notifications.js';

  const searchInput = document.querySelector('#search-input');
  const searchStatus = document.querySelector('#search-status');
  const searchResults = document.querySelector('#search-results');
  const professionalRequestButton = document.querySelector('#professional-request-button');

  document.querySelector('#ui-eyebrow').textContent = UI_STRINGS.landing.eyebrow;
  document.querySelector('#ui-title').textContent = UI_STRINGS.landing.title;
  document.querySelector('#search-input').placeholder = UI_STRINGS.landing.searchPlaceholder;
  document.querySelector('#ui-looking').textContent = UI_STRINGS.landing.lookingForWork;
  document.querySelector('#ui-login-link').textContent = UI_STRINGS.landing.loginLink;
  document.querySelector('.round-cta span').textContent = UI_STRINGS.landing.professionalRequest;

  async function updateSearchStatus() {
    const searchTerm = searchInput.value.trim();
    if (!searchTerm) {
      searchStatus.textContent = UI_STRINGS.search.empty;
      searchResults.replaceChildren();
      return;
    }

    if (!isFirebaseConfigured()) {
      searchStatus.textContent = UI_STRINGS.search.unavailable;
      return;
    }

    try {
      const profiles = await findPublicProfiles(searchTerm);
      searchStatus.textContent = profiles.length
        ? UI_STRINGS.search.resultCount(profiles.length)
        : UI_STRINGS.search.noResults;
      searchResults.replaceChildren(...profiles.map((profile) => {
        const link = document.createElement('a');
        link.className = 'search-result glass';
        link.href = `profile.html?pro=${encodeURIComponent(profile.id)}`;
        link.innerHTML = `<strong></strong><span></span>`;
        link.querySelector('strong').textContent = profile.displayName || profile.name || UI_STRINGS.publicProfile.noName;
        link.querySelector('span').textContent = (profile.categories || []).join(' · ') || UI_STRINGS.search.openProfile;
        return link;
      }));
    } catch (error) {
      searchStatus.textContent = UI_STRINGS.search.error;
      searchResults.replaceChildren();
      showNotification(UI_STRINGS.search.error, 'error');
      console.error(error);
    }
  }

  searchInput.addEventListener('input', debounce(updateSearchStatus));
  professionalRequestButton.addEventListener('click', () => window.location.assign('request-professional.html'));
  searchStatus.textContent = UI_STRINGS.search.empty;
</script>

</body>
</html>
