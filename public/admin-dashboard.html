<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR Booking Premium - Administration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/base.css?v=scrollbar-20260909">
    <link rel="stylesheet" href="assets/css/glass-theme.css">
    <script src="firebase-config.js?v=local-emulator-routing-20260910"></script>
    <link rel="stylesheet" href="assets/css/pro-dashboard.css?v=admin-requests-20260909">
</head>
<body>
<main class="pro-dashboard-screen" data-admin-shell>
  <div class="pro-dashboard-wrap">
    <header class="glass pro-topbar" data-admin-navbar></header>
    <p class="dashboard-status" data-admin-status role="status" aria-live="polite"></p>
    <section class="glass admin-request-panel" aria-labelledby="admin-title">
      <div class="working-hours-header"><div><span class="eyebrow">JR BOOKING PREMIUM</span><h1 id="admin-title">Demandes professionnelles</h1></div><button class="btn btn-ghost" type="button" data-admin-refresh>Actualiser</button></div>
      <div data-admin-requests><p class="working-hours-feedback">Chargement des demandes...</p></div>
    </section>
    <section class="glass admin-request-panel" aria-labelledby="audit-title">
      <div class="working-hours-header"><div><span class="eyebrow">JOURNAL</span><h2 id="audit-title">Journal d’audit</h2></div><button class="btn btn-ghost" type="button" data-admin-audit-refresh>Actualiser</button></div>
      <div data-admin-audit><p class="working-hours-feedback">Chargement du journal...</p></div>
    </section>
    <section class="glass admin-request-panel" aria-labelledby="queues-title">
      <div class="working-hours-header"><div><span class="eyebrow">SUIVI</span><h2 id="queues-title">Tickets et demandes de données</h2></div><button class="btn btn-ghost" type="button" data-admin-queues-refresh>Actualiser</button></div>
      <div class="admin-queues-grid"><div><h3>Tickets support</h3><div data-admin-tickets><p class="working-hours-feedback">Chargement...</p></div></div><div><h3>Demandes de données</h3><div data-admin-data-requests><p class="working-hours-feedback">Chargement...</p></div></div></div>
    </section>
  </div>
</main>
<script type="module" src="js/admin/admin-dashboard.js?v=email-first-review-20260910"></script>
</body>
</html>
